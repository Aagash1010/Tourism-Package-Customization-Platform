spring.application.name=ceylon-explore-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ceylon_explore}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Create/update mapped tables without dropping existing tables or records.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}

# Development defaults for a static frontend served from VS Code Live Server.
# Override with CORS_ALLOWED_ORIGINS when the frontend uses a different origin.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Default admin credentials for the admin dashboard and booking management
# These values are safe defaults and may be overridden via environment variables.
INITIAL_ADMIN_NAME=Admin User
INITIAL_ADMIN_EMAIL=admin@ceylonexplore.com
INITIAL_ADMIN_PASSWORD=Admin@1234
