spring.application.name=ceylon-explore-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ceylon_explore}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# This foundation does not create or modify database tables.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Development defaults for a static frontend served from VS Code Live Server.
# Override with CORS_ALLOWED_ORIGINS when the frontend uses a different origin.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
